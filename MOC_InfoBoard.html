<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOC HSE InfoBoard</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071523;color:#fff;font-family:Arial,sans-serif}
#screen{position:absolute;left:0;top:0;width:100%;height:100%;background:#071523}
#slide{display:none;position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
#message{position:absolute;left:3%;bottom:4%;font-size:19px;color:#d3e4eb;max-width:90%;line-height:1.5}
#small{position:absolute;left:12px;bottom:8px;font-size:12px;color:#9eb5c3}
</style>
</head>
<body><div id="screen"><img id="slide" alt="MOC HSE slide"><div id="message">Loading MOC HSE InfoBoard…</div><div id="small">MOC HSE InfoBoard</div></div>
<script>
(function(){
'use strict';
var INTERVAL=15000, UPDATE=5*60*1000;
var slides=[],version='',index=0,rotator=null,checking=false;
var img=document.getElementById('slide'),msg=document.getElementById('message');
function showError(s){msg.style.display='block';msg.innerHTML='MOC HSE InfoBoard: '+s;}
function showSlide(){
 if(!slides.length){showError('No slides available');return;}
 var src='slides/'+encodeURIComponent(slides[index])+'?v='+encodeURIComponent(version);
 var preload=new Image();
 preload.onload=function(){img.src=src;img.style.display='block';msg.style.display='none';};
 preload.onerror=function(){showError('Cannot load image '+(index+1)+' of '+slides.length+'. Retrying…');setTimeout(showSlide,15000);};
 preload.src=src;
}
function next(){if(!slides.length)return;index=(index+1)%slides.length;showSlide();}
function startRotation(){if(rotator)clearInterval(rotator);rotator=setInterval(next,INTERVAL);}
function requestManifest(){
 if(checking)return;checking=true;
 var xhr=new XMLHttpRequest();
 var done=false;
 var watchdog=setTimeout(function(){if(!done){done=true;checking=false;try{xhr.abort()}catch(e){}if(!slides.length)showError('Timeout loading slides list. Retrying…');setTimeout(requestManifest,30000)}},25000);
 xhr.onreadystatechange=function(){
  if(xhr.readyState!==4||done)return;done=true;clearTimeout(watchdog);checking=false;
  if(xhr.status>=200&&xhr.status<300){
   try{
    var data=JSON.parse(xhr.responseText);
    if(!data.slides||!data.slides.length)throw new Error('Empty slide list');
    if(data.version!==version||!slides.length){version=String(data.version||'1');slides=data.slides;index=0;showSlide();startRotation();}
   }catch(e){if(!slides.length)showError('Invalid slides.json: '+e.message);}
  }else{if(!slides.length)showError('Slides not published yet (HTTP '+xhr.status+'). Retrying…');}
 };
 xhr.onerror=function(){if(!slides.length)showError('Network error loading slides list. Retrying…')};
 try{xhr.open('GET','slides/slides.json?t='+new Date().getTime(),true);xhr.send(null)}catch(e){done=true;clearTimeout(watchdog);checking=false;showError(e.message)}
}
window.onerror=function(message){showError('JavaScript error: '+message);return false};
requestManifest();setInterval(requestManifest,UPDATE);setInterval(function(){if(!slides.length)requestManifest()},30000);
})();
</script></body></html>
