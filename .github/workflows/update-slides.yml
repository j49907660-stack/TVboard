name: Update MOC TV slides
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */4 * * *'
permissions:
  contents: write
concurrency:
  group: moc-tv-update
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF renderer
        run: python -m pip install 'PyMuPDF>=1.24,<1.27'
      - name: Convert SharePoint PDF into JPG slides
        env:
          MOC_PDF_ENDPOINT: ${{ secrets.MOC_PDF_ENDPOINT }}
        run: python convert_pdf.py
      - name: Commit published slides if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A slides
          if ! git diff --cached --quiet; then
            git commit -m 'Update MOC TV slides'
            git push
          fi
