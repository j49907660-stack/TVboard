<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOC HSE InfoBoard</title><meta name="theme-color" content="#071523">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071523;color:#fff;font:16px Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;background:#071523;overflow:hidden;cursor:none}
.page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .45s ease;background:#071523}.page.active{opacity:1}.page canvas{display:block;max-width:100%;max-height:100%;object-fit:contain}
#splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#e2eff7;text-align:center;padding:28px}#splash h1{font-size:clamp(28px,5vw,58px);margin:0}#splash p{max-width:750px;line-height:1.5;color:#adbfcc}
#controls{position:fixed;top:15px;right:16px;z-index:5;opacity:0;transition:opacity .2s;display:flex;gap:8px}body.show-ui #controls,body.settings-open #controls{opacity:1}body.show-ui #stage{cursor:default}
button{border:0;border-radius:8px;background:#167e87;color:white;padding:12px 16px;font:inherit;cursor:pointer}button.secondary{background:#284252}
#footer{position:fixed;bottom:12px;left:18px;right:18px;z-index:3;display:flex;justify-content:space-between;color:#d3e4eb;font-size:14px;text-shadow:0 1px 4px #000;opacity:0;pointer-events:none}body.show-ui #footer{opacity:1}
#panel{display:none;position:fixed;z-index:10;inset:0;overflow:auto;background:rgba(4,15,26,.98);padding:24px}body.settings-open #panel{display:block}.wrap{max-width:770px;margin:auto}h2{margin:4px 0 8px}.muted{color:#b8cdd9;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:15px 0;display:flex;flex-direction:column;gap:8px}label{font-size:14px;color:#c6dce6}input{font:inherit;color:white;background:#152c3a;border:1px solid #537181;border-radius:7px;padding:11px;min-width:0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.status{background:#10293a;padding:14px;border-radius:8px;white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}.note{padding:10px 14px;border-left:3px solid #47c2c5;background:#142b38;color:#c6d9e5;line-height:1.5}.tiny{font-size:13px}#upload{max-width:100%}@media(max-width:600px){.grid{grid-template-columns:1fr}#panel{padding:16px}}
</style>
</head>
<body>
<div id="stage"><div class="page" id="page0"></div><div class="page" id="page1"></div><div id="splash"><h1>MOC HSE InfoBoard</h1><p id="splashmsg">Loading the latest presentation…</p></div></div>
<div id="controls"><button id="settingsBtn">⚙ Settings</button></div>
<div id="footer"><span id="stateLabel">HSE InfoBoard</span><span id="pageCount">—</span></div>
<div id="panel"><div class="wrap"><h2>MOC HSE InfoBoard <small style="font-size:14px;color:#91aebd">v2.1</small></h2>
<div class="grid"><div class="field"><label for="duration">Seconds per slide</label><input type="number" id="duration" min="3" max="3600" value="15"></div><div class="field"><label for="hours">Check for changes (hours)</label><input type="number" id="hours" min="0.0167" max="720" step="any" value="4"></div></div>
<div class="actions"><button id="saveBtn">Save settings</button><button id="refreshBtn" class="secondary">Check now</button><button id="closeBtn" class="secondary">Return to slides</button><button id="fullscreenBtn" class="secondary">Fullscreen</button></div>
<h3>Player status</h3><div id="status" class="status">Starting…</div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){'use strict';
// The URL grants access if the HTTP trigger is configured for anonymous/signed-link access.
// DO NOT publish the HTML containing this URL in a public repository.
var PDF_ENDPOINT='https://default810e707a0fee4c86951994811f49ad.0e.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/22/workflows/80233ea49c834f34bf8032ac9031bcc7/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=eJpjjR4x1gfozOuzy-qDlkDCX5oU9kATm9hN4-qH50Q';
var LIB='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var SETTINGS_KEY='moc_infoboard_pdf_settings';var DB='moc_infoboard_pdf_cache';
var $=function(id){return document.getElementById(id)};
var cfg={duration:15,hours:4};try{var c=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');if(Number(c.duration)>=3)cfg.duration=Number(c.duration);if(Number(c.hours)>=1/60)cfg.hours=Number(c.hours)}catch(e){}
var doc=null,active=0,pageIndex=0,autoTimer=null,checkTimer=null,retryTimer=null,uiTimer=null,currentBytes=null,mode='remote',busy=false,rendering=false,lastChecked='Never',lastUpdated='Never',lastError='',offline=false,generation=0;
function showUI(){document.body.classList.add('show-ui');clearTimeout(uiTimer);uiTimer=setTimeout(function(){if(!document.body.classList.contains('settings-open'))document.body.classList.remove('show-ui')},6000)}
function status(){var t=['Mode: '+(mode==='manual'?'Manual PDF':'Automatic SharePoint PDF'),'Pages: '+(doc?doc.numPages:'—'),'Current page: '+(doc?(pageIndex+1):'—'),'Slide interval: '+cfg.duration+' seconds','Check interval: '+cfg.hours+' hours','Last check: '+lastChecked,'Last successful update: '+lastUpdated,'Offline cache: '+(offline?'cached copy in use':'not in use')];if(lastError)t.push('Last error: '+lastError);$('status').textContent=t.join('\n');$('stateLabel').textContent=offline?'Cached presentation':mode==='manual'?'Local test PDF':'MOC HSE InfoBoard';$('pageCount').textContent=doc?(pageIndex+1)+' / '+doc.numPages:'—'}
function saveCache(bytes){return new Promise(function(resolve){if(!window.indexedDB){resolve();return}try{var request=indexedDB.open(DB,1);request.onupgradeneeded=function(){request.result.createObjectStore('files')};request.onerror=function(){resolve()};request.onsuccess=function(){var db=request.result;var tx=db.transaction('files','readwrite');tx.objectStore('files').put(bytes.slice(0),'latest');tx.oncomplete=tx.onerror=function(){db.close();resolve()}}}catch(e){resolve()}})}
function readCache(){return new Promise(function(resolve){if(!window.indexedDB){resolve(null);return}try{var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){r.result.createObjectStore('files')};r.onerror=function(){resolve(null)};r.onsuccess=function(){var db=r.result,tx=db.transaction('files','readonly'),q=tx.objectStore('files').get('latest');q.onsuccess=function(){resolve(q.result||null)};q.onerror=function(){resolve(null)};tx.oncomplete=function(){db.close()}}}catch(e){resolve(null)}})}
function isPdf(bytes){return bytes&&bytes.byteLength>5&&String.fromCharCode.apply(null,new Uint8Array(bytes.slice(0,5)))==='%PDF-'}
function sameBytes(a,b){if(!a||!b||a.byteLength!==b.byteLength)return false;var x=new Uint8Array(a),y=new Uint8Array(b);for(var i=0;i<x.length;i++)if(x[i]!==y[i])return false;return true}
async function makeDocument(bytes){if(!window.pdfjsLib)throw new Error('PDF.js library did not load. Check internet access to cdnjs.cloudflare.com');pdfjsLib.GlobalWorkerOptions.workerSrc=LIB;return await pdfjsLib.getDocument({data:bytes.slice(0)}).promise}
function canvasSlot(n){var slot=$('page'+n);slot.innerHTML='';var canvas=document.createElement('canvas');slot.appendChild(canvas);return canvas}
async function paint(pdf,n,slot,g){var page=await pdf.getPage(n+1);if(g!==generation)return;var base=page.getViewport({scale:1});var sw=window.innerWidth||1920,sh=window.innerHeight||1080;var factor=Math.min(sw/base.width,sh/base.height);var cap=1.6;factor=Math.max(.25,Math.min(factor* Math.min(window.devicePixelRatio||1,1.3),cap*factor));var viewport=page.getViewport({scale:factor});var canvas=canvasSlot(slot);canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);var context=canvas.getContext('2d',{alpha:false});await page.render({canvasContext:context,viewport:viewport,background:'#ffffff'}).promise;if(g!==generation)return;canvas.style.width=Math.min(sw,base.width*factor)+'px';canvas.style.height=Math.min(sh,base.height*factor)+'px'}
async function install(bytes,cache){var pdf=await makeDocument(bytes);if(!pdf.numPages)throw new Error('PDF contains no pages');var g=++generation;await paint(pdf,0,1-active,g);if(g!==generation)return;var old=doc;doc=pdf;currentBytes=bytes.slice(0);pageIndex=0;active=1-active;document.getElementById('splash').style.display='none';$('page'+active).classList.add('active');$('page'+(1-active)).classList.remove('active');lastError='';offline=Boolean(cache);lastUpdated=new Date().toLocaleString();status();startRotation();if(old)try{old.destroy()}catch(e){} }
function startRotation(){clearTimeout(autoTimer);autoTimer=setTimeout(nextPage,cfg.duration*1000)}
async function nextPage(){if(!doc||rendering){startRotation();return}rendering=true;var g=generation;var n=(pageIndex+1)%doc.numPages;var target=1-active;try{await paint(doc,n,target,g);if(g===generation){$('page'+target).classList.add('active');$('page'+active).classList.remove('active');active=target;pageIndex=n;status()}}catch(e){lastError='Slide render failed: '+String(e.message||e);status()}finally{rendering=false;startRotation()}}
function schedule(){clearInterval(checkTimer);checkTimer=setInterval(function(){if(mode==='remote')fetchPdf()},Math.max(60000,cfg.hours*3600000))}
async function fetchPdf(){if(mode!=='remote'||busy)return;busy=true;lastChecked=new Date().toLocaleString();status();try{var ctl=window.AbortController?new AbortController():null;var timeout=setTimeout(function(){if(ctl)ctl.abort()},60000);var resp;try{resp=await fetch(PDF_ENDPOINT,{method:'POST',mode:'cors',cache:'no-store',credentials:'omit',signal:ctl?ctl.signal:undefined})}finally{clearTimeout(timeout)}
if(!resp.ok)throw new Error('HTTP '+resp.status+' from Power Automate (check permissions and flow run history)');var bytes=await resp.arrayBuffer();if(!isPdf(bytes))throw new Error('Response is not a PDF. Check Response Body and flow authentication.');if(mode!=='remote')return;if(!sameBytes(currentBytes,bytes)){await install(bytes,false);await saveCache(bytes)}else{lastError='';offline=false;status()}
}catch(e){lastError=(e.name==='TypeError'?'Network/CORS error: the TV browser could not read the flow response. Check trigger access, CORS and local file restrictions.':String(e.message||e));status();if(!doc){var saved=await readCache();if(saved&&mode==='remote')try{await install(saved,true);lastError='Live connection unavailable; cached PDF shown. '+lastError;status()}catch(x){}}}
finally{busy=false}}
$('settingsBtn').onclick=function(){document.body.classList.add('settings-open','show-ui');$('duration').value=cfg.duration;$('hours').value=cfg.hours;status()};$('closeBtn').onclick=function(){document.body.classList.remove('settings-open');showUI()};$('stage').onclick=showUI;document.onmousemove=function(){if(!document.body.classList.contains('settings-open'))showUI()};document.onkeydown=function(e){if(e.key==='Escape')$('closeBtn').click();else if(e.key==='Enter'&&!document.body.classList.contains('settings-open'))showUI()};
$('saveBtn').onclick=function(){var duration=Number($('duration').value),hours=Number($('hours').value);if(!(duration>=3&&duration<=3600&&hours>=1/60&&hours<=720)){alert('Check interval values');return}cfg={duration:duration,hours:hours};try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(cfg))}catch(e){}schedule();if(doc)startRotation();status();$('closeBtn').click()};$('refreshBtn').onclick=function(){mode='remote';fetchPdf()};
$('fullscreenBtn').onclick=function(){var n=document.documentElement;if(n.requestFullscreen)n.requestFullscreen().catch(function(){});else if(n.webkitRequestFullscreen)n.webkitRequestFullscreen()};
window.addEventListener('resize',function(){if(doc&&!rendering){++generation;paint(doc,pageIndex,active,generation).catch(function(){})}});
async function startup(){status();var cached=await readCache();if(cached&&mode==='remote')try{await install(cached,true)}catch(e){}schedule();await fetchPdf();if(!doc){$('splashmsg').textContent='Could not load PDF. Open Settings to see the error. Check Power Automate access and PDF.js connectivity.';showUI()}}startup();
})();
</script>
</body></html>
